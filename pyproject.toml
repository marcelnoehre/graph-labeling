[project]
name = "graph-labeling"
version = "1.0.0"
description = "Graph labeling"
authors = [
    { name = "marcelnoehre", email = "noehre@cs.uni-kassel.de" }
]
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Creative Commons Attribution 4.0 International Public License (CC BY 4.0)"
]
dependencies = [
    "numpy>=2.4.4",
    "networkx>=3.6.1",
    "shapely>=2.1.2",
    "fcapy>=0.1.4.5",
    "fca-utils",
    "alphashape>=1.3.1",
]

[tool.uv.sources]
fca-utils = { git = "https://github.com/marcelnoehre/fca-utils.git" }
